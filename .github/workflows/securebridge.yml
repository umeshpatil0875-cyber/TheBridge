# SecureBridge pipeline. Read LESSONS.md, Lesson 14, for a line-by-line explanation.
#
# What it does on every push to main and every pull request:
#   1. "test" job: runs the project's own tests, so a broken engine is caught first.
#   2. "scan" job: installs the scanners, runs the bridge, publishes the results, and
#      FAILS the job when the policy verdict is BLOCKED (the bridge exits with code 1).

name: SecureBridge

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # lets you start it by hand from the Actions tab

# Least privilege: by default the workflow may only READ the repository.
# The scan job is granted one extra permission below, and only that job.
permissions:
  contents: read

env:
  # Folder to scan. This demo repo scans the intentionally vulnerable sample app.
  # For a real project, change it to "." to scan the whole repository, which also
  # lets the bridge check its own pipeline files (this workflow) with zizmor.
  SCAN_PATH: sample-app
  # Scanner versions. Empty means "use the latest release". The versions that were
  # actually used are printed in the run log (step "Show scanner versions").
  # To make runs repeatable, copy those numbers here, for example "8.30.1".
  GITLEAKS_VERSION: ""
  TRIVY_VERSION: ""

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the project's tests
        run: python -m unittest discover -s tests -v

  scan:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # needed only to upload SARIF to the Security tab
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The GitHub CLI ("gh") is preinstalled on GitHub's machines. It finds the right
      # file in a release by a name pattern, so we never have to guess a full file name.
      - name: Install the scanners
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pip install semgrep zizmor
          mkdir -p "$HOME/bin" downloads

          fetch() {
            repo="$1"; pattern="$2"; version="$3"
            tag=""
            if [ -n "$version" ]; then tag="v$version"; fi
            if ! gh release download $tag --repo "$repo" --pattern "$pattern" --dir downloads --clobber; then
              echo "Could not download '$pattern' from $repo (${tag:-latest}). Files in that release:"
              gh release view $tag --repo "$repo" --json tagName,assets --jq '.tagName, (.assets[].name)'
              exit 1
            fi
          }

          fetch gitleaks/gitleaks '*linux_x64.tar.gz' "$GITLEAKS_VERSION"
          tar -xzf downloads/gitleaks_*_linux_x64.tar.gz -C "$HOME/bin" gitleaks

          fetch aquasecurity/trivy '*Linux-64bit.tar.gz' "$TRIVY_VERSION"
          tar -xzf downloads/trivy_*_Linux-64bit.tar.gz -C "$HOME/bin" trivy

          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Show scanner versions
        run: |
          gitleaks version
          trivy --version
          semgrep --version
          zizmor --version

      # If the policy blocks, this step exits with code 1 and the job turns red.
      # The steps below use "if: always()" so results are still published.
      - name: Run SecureBridge
        run: python -m bridge scan "$SCAN_PATH" --out out

      - name: Show the report in the run summary
        if: always()
        run: |
          if [ -f out/report.md ]; then cat out/report.md >> "$GITHUB_STEP_SUMMARY"; fi

      # Findings appear in the repository's Security tab (Code scanning).
      # continue-on-error: on private repositories without GitHub code scanning this
      # upload is refused, and that must not hide the real verdict above.
      - name: Upload findings to the Security tab
        if: always() && hashFiles('out/report.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: out/report.sarif
          category: securebridge

      - name: Keep the reports as a download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: securebridge-reports
          path: out/
          if-no-files-found: ignore
